[versions]
minecraft = "1.20.4"
parchment = "2024.04.14"

fabric-loader = "0.19.3"
fabric-api = "0.97.2+1.20.4"
fabric-range-minecraft = "1.20.4"
fabric-range-loader = ">=0.17"

neoforge-loader = "20.4.249"
neoforge-range-loader = "[1,)"
neoforge-range-minecraft = "[1.20.4,1.20.5)"
neoform = "1.20.4-20240627.114801"

forge-loader = "1.20.4-49.2.0"
forge-range-loader = "[49,)"
forge-range-minecraft = "[1.20.4,1.20.5)"

mixin = "0.8.7"
mixin-fabric = "0.16.3+mixin.0.8.7"
mixin-extras = "0.5.4"

# Dependencies (optional)
clothconfig = "13.0.138"
modmenu = "9.0.0"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
parchment = { module = "org.parchmentmc.data:parchment", version.ref = "parchment" }
forge = { module = "net.minecraftforge:forge", version.ref = "forge-loader" }

fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }

mixin = { module = "org.spongepowered:mixin", version.ref = "mixin" }
mixin-fabric = { module = "net.fabricmc:sponge-mixin", version.ref = "mixin-fabric" }
mixin-extras = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixin-extras" }

# Dependencies
clothconfig-fabric = { module = "me.shedaniel.cloth:cloth-config-fabric", version.ref = "clothconfig" }
clothconfig-forge = { module = "me.shedaniel.cloth:cloth-config-forge", version.ref = "clothconfig" }
clothconfig-neoforge = { module = "me.shedaniel.cloth:cloth-config-neoforge", version.ref = "clothconfig" }
modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version = "2.5.0" }
publish = { id = "me.modmuss50.mod-publish-plugin", version = "2.1.1" }

moddev = { id = "net.neoforged.moddev", version = "2.0.141" }

# net.fabricmc.fabric-loom for new unobfuscated minecraft versions
# net.fabricmc.fabric-loom-remap for old obfuscated minecraft versions
loom = { id = "net.fabricmc.fabric-loom-remap", version = "1.17-SNAPSHOT" }

forge-gradle = { id = "net.minecraftforge.gradle", version = "[7.0.29,8)" }
# Only for Minecraft 1.20.4 or lower:
forge-renamer = { id = "net.minecraftforge.renamer", version = "1.1.2" }
