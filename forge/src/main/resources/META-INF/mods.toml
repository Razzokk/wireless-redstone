modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
issueTrackerURL = "${sources}/issues"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}+${minecraft_version}"
displayName = "${mod_name}"
displayURL = "${curseforge_page}"
logoFile = "assets/${mod_id}/icon.png"
logoBlur = false
authors = "${mod_author}"
description = '''${mod_description}'''
displayTest = "MATCH_VERSION"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${forge_minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_version_range}"
ordering = "NONE"
side = "BOTH"
